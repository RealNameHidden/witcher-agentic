[project]
name = "witcher-magentic"
version = "0.1.0"
description = "A step-by-step Magentic agent learning project"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4",
    "agent-framework-openai==1.15.0",
    "agent-framework-core==1.20.0",
    "agent-framework-foundry==1.14.0",
    "agent-framework-orchestrations==1.3.0",
    "azure-identity>=1.26,<2",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
witcher-magentic = "witcher_magentic.app:main"
witcher-dashboard = "witcher_magentic.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
